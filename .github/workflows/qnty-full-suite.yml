name: qnty-full-suite

# Four isolated /tmp-backed CI runners collectively execute every collected
# pytest case exactly once. Keep the original exact full-suite command for
# structural contract tests; PYTEST_ADDOPTS installs the deterministic sharder.
# No TMPDIR, --basetemp, paths filters, protocol, or science changes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  full-suite-shard:
    name: full-suite shard ${{ matrix.index }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (test extras only)
        run: python -m pip install -e ".[test]"

      - name: Full suite (unfiltered, default /tmp-backed tmp_path)
        run: python -m pytest -q
        env:
          PYTEST_ADDOPTS: "-p ci_pytest_shard"
          QNTY_CI_SHARD_INDEX: ${{ matrix.index }}
          QNTY_CI_SHARD_COUNT: "4"

  full-suite:
    name: full-suite
    runs-on: ubuntu-latest
    needs: [full-suite-shard]
    if: always()
    steps:
      - name: All full-suite shards must pass
        env:
          SHARDS_RESULT: ${{ needs.full-suite-shard.result }}
        run: test "$SHARDS_RESULT" = success
