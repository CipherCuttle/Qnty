name: qnty-full-suite

# Collect the entire suite in every job, then partition tests deterministically
# by module. Together, the four jobs run every collected test exactly once.
# Each job receives its own runner and /tmp space (prior unsharded full-suite
# exhausted runner disk and caused hundreds of unrelated failures).
#
# Keep pytest's default /tmp-backed tmp_path. Do NOT change TMPDIR or
# --basetemp: tests/artifacts/test_store.py depends on the /tmp prefix.
#
# Keep the stable "full-suite" aggregate job name for status checks.
# This workflow itself does not create/modify branch-protection rules.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  full-suite-shard:
    name: full-suite shard ${{ matrix.index }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (test extras only)
        run: python -m pip install -e ".[test]"

      - name: Full suite shard (default /tmp-backed tmp_path)
        run: python ci_pytest_shard.py --index ${{ matrix.index }} --count 4

  full-suite:
    name: full-suite
    runs-on: ubuntu-latest
    needs: [full-suite-shard]
    if: always()
    steps:
      - name: All full-suite shards must pass
        env:
          SHARDS_RESULT: ${{ needs.full-suite-shard.result }}
        run: test "$SHARDS_RESULT" = success
